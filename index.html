<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkladWeb - Афіша подій</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="toolbar">
        <button id="searchBtn" class="toolbar-btn search-btn">🔍</button>
        <button id="addDateBtn" class="toolbar-btn">+ Додати дату</button>
        <button id="printBtn" class="toolbar-btn">🖨️ Друк</button>
        <button id="saveBtn" class="toolbar-btn">💾 Зберегти</button>
        <button id="loadBtn" class="toolbar-btn">📂 Завантажити</button>
        <button id="expandAllBtn" class="toolbar-btn">▼ Розгорнути все</button>
        <button id="collapseAllBtn" class="toolbar-btn">▲ Згорнути все</button>
    </div>

    <!-- Search Panel -->
    <div id="searchPanel" class="search-panel">
        <div class="search-panel-content">
            <button id="closeSearchBtn" class="close-search-btn">&times;</button>
            <h3>Пошук подій</h3>
            <div class="search-fields">
                <div class="search-field">
                    <label>Дата:</label>
                    <input type="text" id="searchDate" placeholder="17 липня">
                </div>
                <div class="search-field">
                    <label>Час (від):</label>
                    <input type="time" id="searchTimeFrom">
                </div>
                <div class="search-field">
                    <label>Час (до):</label>
                    <input type="time" id="searchTimeTo">
                </div>
                <div class="search-field">
                    <label>Місце:</label>
                    <input type="text" id="searchPlace" placeholder="Будинок Кіно">
                </div>
            </div>
            <div class="search-actions">
                <button id="applySearchBtn" class="toolbar-btn">Знайти</button>
                <button id="clearSearchBtn" class="toolbar-btn">Очистити</button>
            </div>
            <div id="searchResults" class="search-results"></div>
        </div>
    </div>

    <div class="page-container">
        <div class="a4-page" id="document">
            <h1 class="document-title" contenteditable="true">Афіша кіно</h1>
        </div>
    </div>

    <!-- Modal for adding/editing event -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2 id="modalTitle">Додати подію</h2>
            <form id="eventForm">
                <label>Назва:</label>
                <input type="text" id="eventName" required placeholder="Небеса Діани">

                <label>Місце:</label>
                <input type="text" id="eventPlace" required placeholder="Будинок Кіно">

                <label>Час:</label>
                <input type="text" id="eventTime" required placeholder="12:30">

                <label>Посилання:</label>
                <input type="url" id="eventLink" placeholder="https://...">

                <input type="hidden" id="eventId">
                <input type="hidden" id="dateGroupId">

                <button type="submit" class="submit-btn">Зберегти</button>
            </form>
        </div>
    </div>

    <!-- Modal for adding date -->
    <div id="dateModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Додати дату</h2>
            <form id="dateForm">
                <label>Дата:</label>
                <input type="text" id="dateName" required placeholder="17 липня:">

                <button type="submit" class="submit-btn">Додати</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
